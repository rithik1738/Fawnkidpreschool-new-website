<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your Fawn Kids account to begin your child's educational journey.">
  <title>Sign Up — Fawn Kids</title>
  <script>
    // Immediate script to prevent dark mode flashing
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700&family=Inter:wght@300;400;500;600;700&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal: #2D6A4F;
      --teal-hover: #245A43;
      --teal-light: rgba(45, 106, 79, 0.08);
      --text: #1A1A1A;
      --text-muted: #6B7280;
      --input-bg: #F3F4F6;
      --input-border: #E5E7EB;
      --border: #E5E7EB;
      --white: #FFFFFF;
      --font-heading: 'Raleway', sans-serif;
      --font-body: 'Inter', -apple-system, sans-serif;
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-body);
      color: var(--text);
      background: var(--white);
      min-height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* --- Left: Illustration --- */
    .signup-illustration {
      flex: 0 0 45%;
      max-width: 45%;
      position: relative;
      overflow: hidden;
    }

    .signup-illustration img {
      width: 100%;
      height: 100vh;
      object-fit: cover;
      display: block;
      border-radius: 0 24px 24px 0;
      transform: scale(1.02);
      transition: transform 8s ease;
    }

    .signup-illustration:hover img {
      transform: scale(1.06);
    }

    /* Subtle overlay gradient */
    .signup-illustration::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(45,106,79,0.05) 0%, transparent 60%);
      border-radius: 0 24px 24px 0;
      pointer-events: none;
    }

    /* --- Right: Form --- */
    .signup-form-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 48px;
      position: relative;
    }

    .lang-selector {
      position: absolute;
      top: 24px;
      right: 32px;
      font-size: 0.85rem;
      color: var(--teal);
      cursor: pointer;
      font-weight: 500;
      transition: opacity 0.3s ease;
    }

    .lang-selector:hover { opacity: 0.7; }

    .signup-form-container {
      width: 100%;
      max-width: 420px;
    }

    /* Title */
    .signup-form-container h1 {
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: 600;
      color: var(--teal);
      text-align: center;
      margin-bottom: 36px;
    }

    /* Inputs */
    .form-field {
      margin-bottom: 16px;
    }

    .form-field input {
      width: 100%;
      padding: 16px 18px;
      background: var(--input-bg);
      border: 1.5px solid transparent;
      border-radius: 10px;
      font-family: var(--font-body);
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .form-field input::placeholder {
      color: #9CA3AF;
      font-weight: 400;
    }

    .form-field input:focus {
      background: var(--white);
      border-color: var(--teal);
      box-shadow: 0 0 0 4px rgba(45, 106, 79, 0.1);
    }

    /* Password field with toggle */
    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 50px;
    }

    /* Hide browser's built-in password eye icon */
    input::-ms-reveal,
    input::-ms-clear {
      display: none !important;
    }

    .password-toggle {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 50px;
      background: none;
      border: none;
      cursor: pointer;
      color: #9CA3AF;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
      padding: 0;
      margin: 0;
    }

    .password-toggle:hover { color: var(--teal); }

    .password-toggle svg {
      width: 18px;
      height: 18px;
    }

    .password-toggle::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 2px;
      height: 0;
      background: #9CA3AF;
      transform: translate(-50%, -50%) rotate(45deg);
      transition: height 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 2px;
    }

    .password-toggle.slashed::after {
      height: 24px;
    }

    .password-toggle.slashed:hover::after {
      background: var(--teal);
    }

    /* Sign Up Button */
    .btn-signup {
      width: 100%;
      padding: 16px;
      background: var(--teal);
      color: var(--white);
      border: none;
      border-radius: 10px;
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-signup::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s ease, height 0.6s ease;
    }

    .btn-signup:hover {
      background: var(--teal-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(45, 106, 79, 0.3);
    }

    .btn-signup:hover::before {
      width: 400px;
      height: 400px;
    }

    .btn-signup:active {
      transform: translateY(0) scale(0.98);
    }

    /* Divider */
    .divider {
      height: 40px;
    }

    /* Social Buttons */
    .social-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-social {
      width: 100%;
      padding: 14px 18px;
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .btn-social::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--teal-light);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .btn-social:hover {
      border-color: var(--teal);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .btn-social:hover::after { opacity: 1; }

    .btn-social:active { transform: translateY(0) scale(0.98); }

    .btn-social img, .btn-social svg {
      width: 22px;
      height: 22px;
      position: relative;
      z-index: 1;
    }

    .btn-social span { position: relative; z-index: 1; }

    /* Login Link */
    .login-link {
      text-align: center;
      margin-top: 32px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .login-link a {
      color: var(--teal);
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }

    .login-link a:hover { opacity: 0.7; }

    /* --- Animations --- */
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-60px) scale(0.95); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }

    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .signup-illustration {
      animation: slideInLeft 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .signup-form-container h1 {
      opacity: 0;
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }

    .form-field:nth-child(1) { opacity: 0; animation: fadeInUp 0.5s ease 0.4s forwards; }
    .form-field:nth-child(2) { opacity: 0; animation: fadeInUp 0.5s ease 0.5s forwards; }
    .form-field:nth-child(3) { opacity: 0; animation: fadeInUp 0.5s ease 0.6s forwards; }

    .btn-signup { opacity: 0; animation: fadeInUp 0.5s ease 0.7s forwards; }

    .social-buttons .btn-social:nth-child(1) { opacity: 0; animation: fadeInUp 0.4s ease 0.85s forwards; }
    .social-buttons .btn-social:nth-child(2) { opacity: 0; animation: fadeInUp 0.4s ease 0.95s forwards; }
    .social-buttons .btn-social:nth-child(3) { opacity: 0; animation: fadeInUp 0.4s ease 1.05s forwards; }

    .login-link { opacity: 0; animation: fadeInUp 0.4s ease 1.15s forwards; }

    .lang-selector { opacity: 0; animation: fadeInUp 0.4s ease 0.5s forwards; }

    /* --- Input focus effect --- */
    .form-field {
      position: relative;
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
      body { flex-direction: column; overflow-y: auto; }

      .signup-illustration {
        flex: none;
        max-width: 100%;
        height: 280px;
      }

      .signup-illustration img {
        height: 280px;
        border-radius: 0 0 24px 24px;
      }

      .signup-illustration::after { border-radius: 0 0 24px 24px; }

      .signup-form-side {
        padding: 32px 24px 48px;
      }

      .signup-form-container h1 { font-size: 1.7rem; }

      .lang-selector { top: -260px; right: 16px; color: #fff; }
    }

    /* --- Reduced Motion --- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      .signup-form-container h1,
      .form-field, .btn-signup,
      .social-buttons .btn-social,
      .login-link, .lang-selector { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Left: Illustration -->
  <div class="signup-illustration">
    <img src="images/a woman teaching to childrenf 1.png" alt="Teacher guiding a child through creative learning at Fawn Kids">
  </div>

  <!-- Right: Form -->
  <div class="signup-form-side">
    <span class="lang-selector">English</span>

    <div class="signup-form-container">
      <h1>Create an account</h1>

      <form id="signupForm" onsubmit="return false;">
        <div class="form-field">
          <input type="text" id="name" placeholder="Name" autocomplete="name" required>
        </div>

        <div class="form-field">
          <input type="email" id="email" placeholder="Email Address" autocomplete="email" required>
        </div>

        <div class="form-field">
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Password" autocomplete="new-password" required>
            <button type="button" class="password-toggle" id="pwdToggle" aria-label="Toggle password visibility">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-signup" id="signupBtn">Sign up</button>
      </form>

      <div class="divider"></div>

      <div class="social-buttons">
        <button class="btn-social" type="button">
          <svg width="22" height="22" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          <span>Sign up with Google</span>
        </button>

        <button class="btn-social" type="button">
          <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#1877F2"/><path d="M16.67 15.13l.55-3.58h-3.44v-2.32c0-.98.48-1.94 2.02-1.94h1.57V4.17s-1.42-.24-2.78-.24c-2.84 0-4.69 1.72-4.69 4.83v2.73H7v3.58h2.9V24h3.56V15.13h2.21z" fill="white"/></svg>
          <span>Sign up with Facebook</span>
        </button>

        <button class="btn-social" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          <span>Sign up with X</span>
        </button>
      </div>

      <p class="login-link">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

  <script src="site.js"></script>
  <script>
    // Password toggle with strike animation
    document.getElementById('pwdToggle').addEventListener('click', function() {
      const pwd = document.getElementById('password');
      this.classList.toggle('slashed');
      pwd.type = this.classList.contains('slashed') ? 'text' : 'password';
    });

    // Form submit logic with Supabase Auth integration
    document.getElementById('signupForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;

      const btn = document.getElementById('signupBtn');
      const originalText = btn.textContent;
      
      btn.textContent = '';
      btn.style.pointerEvents = 'none';
      btn.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" style="animation:spin 0.8s linear infinite;"><circle cx="12" cy="12" r="10" stroke="white" stroke-width="3" fill="none" stroke-dasharray="31.4" stroke-linecap="round"/></svg>';

      window.FawnKidsSite.signUp(name, email, password, function (success, errorMsg) {
        if (success) {
          localStorage.setItem(window.FawnKidsSite.keys.lastSignupEmail, email);
          btn.innerHTML = '<i class="fa-solid fa-check"></i> Account Created!';
          btn.style.background = '#22C55E';
          
          if (window.FawnKidsSite && window.FawnKidsSite.showToast) {
            window.FawnKidsSite.showToast('Registration successful! Redirecting to login...', 'success');
          }
          
          setTimeout(() => {
            btn.textContent = originalText;
            btn.style.background = '';
            btn.style.pointerEvents = '';
            window.location.href = 'login.html';
          }, 1700);
        } else {
          btn.textContent = 'Sign up';
          btn.style.background = '';
          btn.style.pointerEvents = '';
          window.FawnKidsSite.showToast(errorMsg || 'Failed to create account. Please try again.', 'error');
        }
      });
    });

    // Magnetic button effect
    document.querySelector('.btn-signup').addEventListener('mousemove', (e) => {
      const btn = e.currentTarget;
      const rect = btn.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;
      btn.style.transform = `translate(${x * 0.08}px, ${y * 0.08}px)`;
    });
    document.querySelector('.btn-signup').addEventListener('mouseleave', (e) => {
      e.currentTarget.style.transform = '';
    });

    // Input label float animation
    document.querySelectorAll('.form-field input').forEach(input => {
      input.addEventListener('focus', () => {
        input.parentElement.closest('.form-field').style.transform = 'scale(1.01)';
      });
      input.addEventListener('blur', () => {
        input.parentElement.closest('.form-field').style.transform = '';
      });
    });
  </script>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <!-- Curtain Transition Overlay -->
  <div id="curtain-overlay"></div>

  <!-- Floating Dark Mode Toggle Button -->
  <button id="theme-toggle-btn" class="floating-theme-toggle" aria-label="Toggle Dark Mode">
    <div class="icon-wrapper">
      <i class="fas fa-moon moon-icon"></i>
      <i class="fas fa-sun sun-icon"></i>
    </div>
  </button>

  <script>
    (function() {
      const toggleBtn = document.getElementById('theme-toggle-btn');
      const curtain = document.getElementById('curtain-overlay');
      
      if (toggleBtn && curtain) {
        let isAnimating = false;
        
        toggleBtn.addEventListener('click', () => {
          if (isAnimating) return;
          isAnimating = true;
          
          const isCurrentlyDark = document.documentElement.classList.contains('dark');
          const nextTheme = isCurrentlyDark ? 'light' : 'dark';
          
          curtain.style.backgroundColor = nextTheme === 'dark' ? '#0e0e0e' : '#FAF6F0';
          curtain.style.transformOrigin = 'top';
          curtain.style.transform = 'scaleY(1)';
          
          setTimeout(() => {
            if (nextTheme === 'dark') {
              document.documentElement.classList.add('dark');
              localStorage.setItem('theme', 'dark');
            } else {
              document.documentElement.classList.remove('dark');
              localStorage.setItem('theme', 'light');
            }
            
            curtain.style.transformOrigin = 'bottom';
            curtain.style.transform = 'scaleY(0)';
            
            setTimeout(() => {
              curtain.style.transformOrigin = 'top';
              isAnimating = false;
            }, 550);
          }, 550);
        });
      }
    })();
  </script>
</body>
</html>
